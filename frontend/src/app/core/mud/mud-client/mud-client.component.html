<div class="mud-wrapper">
  <!-- Terminal -->
  <app-mud-output class="terminal"></app-mud-output>

  @if (isConnected$ | async) {
    <app-mud-input
      [mode]="(showEcho$ | async) ? 'text' : 'password'"
      (submitCommand)="onSend($event)"
    >
    </app-mud-input>
  } @else {
    <div class="disconnected-panel">
      <p>Disconnected!</p>
      <button type="button" (click)="connect()">Reconnect</button>
    </div>
  }
</div>
