<form [formGroup]="form">
  <textarea
    *ngIf="mode === 'text'"
    id="mud-input"
    pInputTextarea
    class="mud-input"
    (keydown)="onKeyDown($event)"
    (keyup)="onKeyUp($event)"
    formControlName="inpmessage"
    [autoResize]="true"
    placeholder="Gib hier deine Befehle ein!"
  >
  </textarea>
  <input
    *ngIf="mode === 'password'"
    id="mud-input-hidden"
    pInputText
    (keydown)="onKeyDown($event)"
    formControlName="inpmessage"
    type="password"
  />
</form>
