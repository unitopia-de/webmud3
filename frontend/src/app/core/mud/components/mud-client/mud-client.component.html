<div
  class="sr-announcer"
  role="log"
  aria-live="polite"
  aria-relevant="additions text"
  aria-atomic="false"
  #liveRegionRef
></div>

<div
  class="sr-input"
  role="status"
  aria-live="assertive"
  aria-relevant="additions text"
  #inputRegionRef
></div>

<div
  class="sr-history"
  aria-label="Ausgabe"
  role="log"
  aria-live="off"
  #historyRegionRef
></div>

<div class="mud-output" #hostRef>
  <!--
    Two draggable handles for the touch-friendly range-selection mode.
    Positioned absolutely over the xterm canvas. The host computes
    `xtermStartMarkerPos` / `xtermEndMarkerPos` from the anchor/end
    buffer coordinates; the computed signals re-evaluate whenever the
    terminal scrolls or resizes. Each handle owns its drag-pointer
    pipeline via `onXtermMarkerPointerDown` — the surrounding
    capture-phase pointer listener checks `closest('.selection-marker')`
    so it doesn't swallow the drag start.
  -->
  @if (selectionMode.isActive()) {
    @if (xtermStartMarkerPos(); as p) {
      <button
        type="button"
        class="selection-marker selection-marker-start"
        [style.left.px]="p.x"
        [style.top.px]="p.y"
        (pointerdown)="onXtermMarkerPointerDown($event, 'start')"
        aria-label="Markierungs-Start verschieben"
      ></button>
    }
    @if (xtermEndMarkerPos(); as p) {
      <button
        type="button"
        class="selection-marker selection-marker-end"
        [style.left.px]="p.x"
        [style.top.px]="p.y"
        (pointerdown)="onXtermMarkerPointerDown($event, 'end')"
        aria-label="Markierungs-Ende verschieben"
      ></button>
    }
  }
</div>

@if (useMobileInput) {
  <app-mobile-input
    [historyProvider]="historyProvider"
    [echoVisible]="viewState.localEchoEnabled"
    (commit)="onMobileInputCommit($event)"
  ></app-mobile-input>
}

<!--
  Singleton choice-menu for MXP click-actions with multiple candidate
  commands (e.g. <ircontent>'s `betrachte | nimm | …`). Hidden when no
  menu is open; positioned at the click coordinates by the service.
-->
<app-mxp-choice-menu></app-mxp-choice-menu>
