<div
  class="sr-announcer"
  role="log"
  aria-live="polite"
  aria-relevant="additions text"
  aria-atomic="false"
  #liveRegionRef
></div>

<div
  class="sr-input"
  role="status"
  aria-live="assertive"
  aria-relevant="additions text"
  #inputRegionRef
></div>

<div
  class="sr-history"
  aria-label="Ausgabe"
  role="log"
  aria-live="off"
  #historyRegionRef
></div>

<div class="mud-output" #hostRef></div>

@if (useMobileInput) {
  <app-mobile-input
    [historyProvider]="historyProvider"
    [echoVisible]="viewState.localEchoEnabled"
    (commit)="onMobileInputCommit($event)"
  ></app-mobile-input>
}

<!--
  Singleton choice-menu for MXP click-actions with multiple candidate
  commands (e.g. <ircontent>'s `betrachte | nimm | …`). Hidden when no
  menu is open; positioned at the click coordinates by the service.
-->
<app-mxp-choice-menu></app-mxp-choice-menu>
