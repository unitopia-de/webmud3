<!--
  EZ-Shell — Output + native Eingabezeile + Footer + Windows.
  Wechsel zurück zu `/` läuft über das Footer-Menü
  ("Eingabe-Modus: klassisch").

  Heading-Hierarchie für AT-H-Taste:
    h1 (hier)               — gesamte EZ-Shell
      h2 Spielausgabe       — in EzOutput
      h2 Befehl-Eingabe     — in EzInput (sr-only, modusabhängig)
      h2 Footer-Sektionen   — im CharFooter
      h2 Fenster-Titel      — pro WindowComponent

  Das h1 ist sr-only — sehende User brauchen es nicht, AT-Nutzer schon.
-->
<h1 class="sr-only">WebMUD3 — EZ-Modus</h1>

<!--
  <main> bündelt den interaktiven Spielbereich (Ausgabe + Eingabe) zu einer
  Landmark, damit AT-Nutzer per Landmark-Navigation ("D" in JAWS) direkt
  hierher springen können. Echter Flex-Container statt `display:contents`,
  weil letzteres die Landmark-Semantik in Safari verlieren kann (siehe
  SCSS .ez-main).
-->
<main class="ez-main">
  <app-ez-output></app-ez-output>

  <app-ez-input (commit)="onCommit($event)"></app-ez-input>
</main>

<!-- Footer als contentinfo-Landmark (Menü, Status, "Sprung zum Ende"). -->
<app-char-footer role="contentinfo"></app-char-footer>

<!-- Windows are an overlay; the container positions them absolutely so
     they float above the rest of the shell. -->
<app-window-container></app-window-container>

<!--
  Singleton choice-menu for MXP click-actions with multiple candidate
  commands (e.g. <ircontent>'s `betrachte | nimm | …`). Hidden when no
  menu is open; positioned at the click coordinates by the service.
-->
<app-mxp-choice-menu></app-mxp-choice-menu>
