<div class="noselect">
  <div>
    <b>{{ path }}</b>
  </div>
  <table>
    @for (entry of entries; track entry; let i = $index) {
      @if (entry.isdir === 0) {
        <tr>
          <td>
            <a
              (click)="fileOpen(entry.name)"
              (keypress)="fileOpen(entry.name)"
              [tabindex]="i"
              >{{ entry.name }}</a
              >
            </td>
            <td>{{ entry.size }}</td>
            <td>{{ entry.filedate }}</td>
            <td>{{ entry.filetime }}</td>
          </tr>
        }
        @if (entry.isdir !== 0) {
          <tr>
            <td>
              <a
                (click)="changeDir(entry.name)"
                (keypress)="changeDir(entry.name)"
                [tabindex]="i"
                >{{ entry.name }}/</a
                >
              </td>
              <td></td>
              <td>{{ entry.filedate }}</td>
              <td>{{ entry.filetime }}</td>
            </tr>
          }
        }
      </table>
    </div>
