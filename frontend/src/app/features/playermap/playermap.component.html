@if (viewModel$ | async; as vm) {
  <div class="pmap-grid" [class.pmap-empty]="vm.empty">
    @for (row of vm.rows; track trackRow($index, row)) {
      <div class="pmap-row">
        @for (cell of row; track trackCell($index, cell)) {
          <span class="pmap-cell" [class.pmap-player]="cell.isPlayer">{{
            cell.ch
          }}</span>
        }
      </div>
    }
  </div>
  @if (vm.empty) {
    <div class="pmap-empty-hint">Keine Karte für diesen Raum.</div>
  }
}
