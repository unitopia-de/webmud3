<ng-container *ngIf="viewModel$ | async as vm">
  <div class="pmap-grid" [class.pmap-empty]="vm.empty">
    <div
      *ngFor="let row of vm.rows; trackBy: trackRow"
      class="pmap-row"
    >
      <span
        *ngFor="let cell of row; trackBy: trackCell"
        class="pmap-cell"
        [class.pmap-player]="cell.isPlayer"
      >{{ cell.ch }}</span>
    </div>
  </div>

  <div *ngIf="vm.empty" class="pmap-empty-hint">
    Keine Karte für diesen Raum.
  </div>
</ng-container>
