<!--
  Screenreader-Pipeline (drei Regionen, analog zu MudClientComponent):
   - sr-announcer    : aktive Live-Ansagen (aria-live=polite)
   - sr-history      : statische Verlauf-Region für H-Tasten-Navigation
   - Terminal-Anzeige selbst ist visuell, für sehende Benutzer.

  Eine Eingabe-Region (sr-input) wird hier bewusst NICHT eingebaut — die
  Eingabe in der EZ-Shell ist ab Phase 3 ein natives <textarea> /
  <input type="password">, das der Screenreader vom Betriebssystem aus
  ohnehin schon vorliest.
-->
<!--
  "Spielausgabe"-Überschrift ist bewusst sr-only: visuell entfernt (kein
  Header-Balken mehr, mehr Platz fürs Terminal), aber als h2 erhalten,
  damit die Heading-Navigation für Screenreader funktioniert und die
  Output-Region weiter per aria-labelledby beschriftet ist.
-->
<h2 id="ez-output-heading" class="sr-only">Spielausgabe</h2>

<!--
  Live-Ansage-Region — EXAKT identisch zur Classic-Shell
  (MudClientComponent): role="log" + aria-live="polite" +
  aria-relevant="additions text" + aria-atomic="false". Geschrieben wird per
  Append (Text anhängen, nie ersetzen) durch MudScreenReaderAnnouncer.
  "polite + additions" = neue Ausgabe wird angehängt und nacheinander
  vorgelesen, OHNE die laufende Ansage zu unterbrechen. Kein Sonderweg mehr
  für /ez — bewusst 1:1 wie Classic, weil das das erprobte Verhalten ist.
-->
<div
  class="sr-announcer"
  role="log"
  aria-live="polite"
  aria-relevant="additions text"
  aria-atomic="false"
  #liveRegionRef
></div>

<!--
  Einmalige Start-Ansage-Region. iOS VoiceOver liest die ERSTE polite-Ansage
  am Seitenanfang unzuverlässig (Region noch nicht als "live" registriert /
  VO liest gerade das Eingabefeld-Label). Diese Region ist assertive +
  role="status" + replace (Zweistufen-Muster) — exakt die Konfiguration des
  Modus-Announcers, der beim Tester zuverlässig liest. Sie wird NUR EINMAL
  beim Start benutzt: der gesammelte Begrüßungstext wird hier forciert
  angesagt. Danach läuft die normale Ausgabe über die polite sr-announcer
  oben (Classic-Verhalten, kein Unterbrechen).
-->
<div
  class="sr-announcer"
  role="status"
  aria-live="assertive"
  aria-atomic="true"
  #startupRegionRef
></div>

<div
  class="sr-history"
  aria-label="Ausgabe"
  role="log"
  aria-live="off"
  #historyRegionRef
></div>

<!--
  Vertical split: the main terminal on top (freely scrollable) and a
  live-tail terminal below that only appears while the user has scrolled
  the main buffer UP off the bottom. The tail mirrors the same output
  stream and always stays scrolled to the end, so the newest output stays
  visible while reading back through history. Scrolling back to the bottom
  (or "Sprung zum Ende") hides it again — see updateTailVisibility().
-->
<div class="ez-output-split">
  <div
    class="ez-mud-output"
    role="region"
    aria-labelledby="ez-output-heading"
    #terminalRef
  >
    <!--
      Two draggable handles for the touch-friendly two-tap-then-drag range
      selection. Positioned absolutely over the xterm canvas; the component
      computes xtermStartMarkerPos / xtermEndMarkerPos from the anchor/end
      buffer coordinates and re-evaluates them whenever the terminal scrolls
      or resizes. The capture-phase pointer listener in setupSelectionTapHandler
      checks `closest('.selection-marker')` so it doesn't swallow the drag.
    -->
    @if (selectionMode.isActive()) {
      @if (xtermStartMarkerPos(); as p) {
        <button
          type="button"
          class="selection-marker selection-marker-start"
          [style.left.px]="p.x"
          [style.top.px]="p.y"
          (pointerdown)="onXtermMarkerPointerDown($event, 'start')"
          aria-label="Markierungs-Start verschieben"
        ></button>
      }
      @if (xtermEndMarkerPos(); as p) {
        <button
          type="button"
          class="selection-marker selection-marker-end"
          [style.left.px]="p.x"
          [style.top.px]="p.y"
          (pointerdown)="onXtermMarkerPointerDown($event, 'end')"
          aria-label="Markierungs-Ende verschieben"
        ></button>
      }
    }
  </div>

  <!--
    Live-tail pane. Always present in the DOM so the second xterm can be
    opened once at mount; collapsed to zero height (`.hidden`) until the
    user scrolls up. `aria-hidden` keeps assistive tech from reading the
    duplicated output — the tail is a purely visual mirror.
  -->
  <div
    class="ez-tail-output"
    [class.hidden]="!tailVisible()"
    [style.flex-basis.%]="tailVisible() ? tailFraction() * 100 : 0"
    aria-hidden="true"
    #tailTerminalRef
  ></div>
</div>
