<app-window
  *ngFor="let cfg of windows$ | async; trackBy: trackByWindowId"
  [config]="cfg"
>
  <ng-container
    *ngIf="componentFor(cfg) as cmp; else placeholder"
    [ngComponentOutlet]="cmp"
  ></ng-container>

  <ng-template #placeholder>
    <div class="placeholder">
      <p><strong>Component:</strong> {{ cfg.component }}</p>
      <pre>{{ toJson(cfg.data) }}</pre>
    </div>
  </ng-template>
</app-window>
