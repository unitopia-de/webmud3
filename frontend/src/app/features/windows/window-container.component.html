@for (cfg of windows$ | async; track trackByWindowId($index, cfg)) {
  <app-window [config]="cfg">
    @if (componentFor(cfg); as cmp) {
      <ng-container
        [ngComponentOutlet]="cmp"
        [ngComponentOutletInputs]="{ config: cfg }"
      ></ng-container>
    } @else {
      <div class="placeholder">
        <p><strong>Component:</strong> {{ cfg.component }}</p>
        <pre>{{ toJson(cfg.data) }}</pre>
      </div>
    }
  </app-window>
}
