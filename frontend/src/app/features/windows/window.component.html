<div
  #titleBar
  class="title-bar"
  (pointerdown)="onTitleBarPointerDown($event)"
  (pointermove)="onTitleBarPointerMove($event)"
  (pointerup)="onTitleBarPointerUp($event)"
  (contextmenu)="$event.preventDefault()"
>
  <h2
    class="title"
    [id]="titleId"
    [title]="config.tooltip ?? config.title"
  >{{ config.title }}</h2>
  <button
    type="button"
    class="close-btn"
    (click)="onClose($event)"
    aria-label="Fenster schließen"
  >
    <span aria-hidden="true">×</span>
  </button>
</div>
<div class="content">
  <ng-content></ng-content>
</div>
