<p-scrollPanel [style]="{width: '100%', height: '400px'}" styleClass="custombar1">
  <ul class="inventory">
    @for (icat of inv.getCategories(); track icat) {
      <li>
        <span class="invcategoryname">{{icat}}</span>
        <ul class="invcategory">
          @for (invitem of inv.getItems(icat); track invitem) {
            <li class="invitem">{{invitem}}</li>
          }
        </ul>
      </li>
    }
  </ul>
</p-scrollPanel>
