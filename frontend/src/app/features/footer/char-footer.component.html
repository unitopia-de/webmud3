<div class="char-info">
  <span class="char-name" *ngIf="charName(); else noChar">{{ charName() }}</span>
  <ng-template #noChar><span class="placeholder">no character</span></ng-template>

  <span
    class="char-vitals"
    [class.flashing]="vitalsFlash()"
    *ngIf="vitalsText() as v"
  >{{ v }}</span>

  <span class="mxp-stats" *ngIf="(mxpDisplay$ | async)?.length">
    <span
      *ngFor="let s of mxpDisplay$ | async"
      class="mxp-stat-pill"
      [title]="s.caption + ' ' + s.value + (s.max ? ' / ' + s.max : '')"
    >
      <span class="mxp-stat-caption">{{ s.caption }}</span>
      <span class="mxp-stat-value">{{ s.value }}</span>
      <span class="mxp-stat-max" *ngIf="s.max">/{{ s.max }}</span>
    </span>
  </span>
</div>

<div class="spacer"></div>

<button
  type="button"
  class="menu-button select-button"
  [class.active]="selectionActive()"
  (click)="toggleSelection($event)"
  [attr.aria-label]="selectionTooltip()"
  [attr.aria-pressed]="selectionActive()"
  [title]="selectionTooltip()"
>
  ⛶
</button>

<div #menuRoot class="menu-root">
  <button
    type="button"
    class="menu-button menu-trigger"
    (click)="toggleMenu($event)"
    [class.open]="menuOpen()"
    aria-label="Einstellungsmenü"
    aria-haspopup="true"
    [attr.aria-expanded]="menuOpen()"
  >
    <span class="trigger-icon" aria-hidden="true">⚙</span>
    <span class="trigger-text" role="heading" aria-level="2">Menü</span>
  </button>

  <div class="menu-dropdown" *ngIf="menuOpen()" role="menu">
    <ng-container *ngIf="(menuItems$ | async)?.length; else emptyMenu">
      <ng-container *ngFor="let item of menuItems$ | async">
        <!-- Item with submenu: clicking toggles the flyout instead of an action -->
        <div *ngIf="item.children?.length; else leaf" class="menu-item-wrapper">
          <button
            type="button"
            class="menu-item has-children"
            role="menuitem"
            aria-haspopup="true"
            [attr.aria-expanded]="openSubmenuId() === item.id"
            [attr.aria-label]="item.label"
            [disabled]="item.disabled"
            (click)="toggleSubmenu($event, item.id)"
          >
            <span class="check" aria-hidden="true">{{ item.checked ? '✓' : '' }}</span>
            <span class="icon" aria-hidden="true" *ngIf="item.icon">{{ item.icon }}</span>
            <span class="label">{{ item.label }}</span>
            <span class="submenu-arrow" aria-hidden="true">▶</span>
          </button>
          <div
            class="submenu"
            *ngIf="openSubmenuId() === item.id"
            role="menu"
          >
            <button
              *ngFor="let child of item.children"
              type="button"
              class="menu-item"
              role="menuitem"
              [attr.aria-label]="child.label"
              [disabled]="child.disabled"
              (click)="onMenuItemClick(child.action)"
            >
              <span class="check" aria-hidden="true">{{ child.checked ? '✓' : '' }}</span>
              <span class="icon" aria-hidden="true" *ngIf="child.icon">{{ child.icon }}</span>
              <span class="label">{{ child.label }}</span>
            </button>
          </div>
        </div>

        <!-- Leaf item -->
        <ng-template #leaf>
          <button
            type="button"
            class="menu-item"
            role="menuitem"
            [attr.aria-label]="item.label"
            [disabled]="item.disabled"
            (click)="onMenuItemClick(item.action)"
          >
            <span class="check" aria-hidden="true">{{ item.checked ? '✓' : '' }}</span>
            <span class="icon" aria-hidden="true" *ngIf="item.icon">{{ item.icon }}</span>
            <span class="label">{{ item.label }}</span>
          </button>
        </ng-template>
      </ng-container>
    </ng-container>
    <ng-template #emptyMenu>
      <div class="menu-empty">no entries</div>
    </ng-template>
  </div>
</div>
