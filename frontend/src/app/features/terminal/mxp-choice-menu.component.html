@if (menu$ | async; as menu) {
  <!--
  The backdrop catches outside-clicks. It is fully transparent so the
  terminal underneath stays visible; pointer-events are needed so the
  click handler actually fires.

  Bewusst ohne Tastatur-Handler und aus dem A11y-Baum genommen: Der Backdrop
  ist reiner Maus-Komfort. Dasselbe leistet für Tastatur-Nutzer die
  Escape-Taste (`@HostListener('document:keydown.escape')` in der Komponente),
  die das Menü ebenfalls schließt — ein fokussierbarer, leerer Backdrop wäre
  nur ein zusätzliches Hindernis in der Tab-Reihenfolge.
  -->

  <div
    class="mxp-choice-backdrop"
    aria-hidden="true"
    (click)="onBackdropClick()"
  ></div>
  <ul
    class="mxp-choice-menu"
    role="menu"
    aria-label="MXP-Befehl wählen"
    [style.left.px]="menu.x"
    [style.top.px]="menu.y"
  >
    @for (cmd of menu.commands; track cmd; let i = $index) {
      <li role="menuitem">
        <button type="button" class="mxp-choice-item" (click)="onPick(cmd)">
          {{ cmd }}
        </button>
      </li>
    }
  </ul>
}
