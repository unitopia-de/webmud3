<div
  class="mobile-input-row"
  role="group"
  aria-label="Eingabezeile"
>
  <button
    type="button"
    class="mobile-input-btn"
    aria-label="Vorheriger Befehl"
    (click)="onHistoryBack()"
  >
    ▲
  </button>

  <button
    type="button"
    class="mobile-input-btn"
    aria-label="Nächster Befehl"
    (click)="onHistoryForward()"
  >
    ▼
  </button>

  <input
    #field
    class="mobile-input-field"
    [type]="echoVisible ? 'text' : 'password'"
    [value]="value"
    [attr.autocomplete]="echoVisible ? 'off' : 'current-password'"
    autocapitalize="off"
    spellcheck="false"
    aria-label="MUD-Eingabe"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (compositionstart)="onCompositionStart()"
    (compositionend)="onCompositionEnd($event)"
  />

  <button
    type="button"
    class="mobile-input-btn mobile-input-send"
    aria-label="Befehl senden"
    (click)="onSubmit()"
  >
    ↵
  </button>
</div>
