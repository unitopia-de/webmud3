# UNItopia Production with TLS Secrets
# docker compose -f dockerfiles/w3_docker_compose_secret.yml -p webmud3tls up -d
services:
  web:
    image: myonara/webmud3:latest
    environment:
      NODE_ENV: 'production'
      HOST: '0.0.0.0'
      PORT: 5000
      SOCKET_ROOT: '/mysocket.io'
      SOCKET_TIMEOUT: 900000
      MUD_CONFIG_PATH: '/run/mud_config_unitopia.json'
      CORS_ALLOWED_ORIGINS: 'https://www.unitopia.de'
      LOG_LEVEL: 'info'
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
      labels:
        com.docker.lb.hosts: www.unitopia.de
        com.docker.lb.network: webnet
        com.docker.lb.port: 2018
        com.docker.lb.ssl_passthrough: "true"
      restart_policy:
        condition: on-failure
    ports:
      - "2018:5000"
    networks:
      - webnet
    secrets:
      - source: www.unitopia.de.cert
        target: /run/secrets/cert.pem
      - source: www.unitopia.de.key
        target: /run/secrets/privkey.pem
networks:
  webnet:
    driver: overlay
    attachable: true
secrets:
  www.unitopia.de.cert:
    file: ../run/secrets/cert.pem
  www.unitopia.de.key:
    file: ../run/secrets/privkey.pem
