# UNItopia Production with Apache Reverse Proxy
# docker compose -f dockerfiles/w3_docker_compose_with_apache.yml -p webmud3apache up -d
services:
  web:
    image: myonara/webmud3:latest
    environment:
      NODE_ENV: 'production'
      HOST: '0.0.0.0'
      PORT: 5000
      SOCKET_ROOT: '/mysocket.io'
      SOCKET_TIMEOUT: 900000
      MUD_CONFIG_PATH: '/run/mud_config_unitopia.json'
      CORS_ALLOWED_ORIGINS: 'https://www.unitopia.de'
      LOG_LEVEL: 'info'
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
      labels:
        com.docker.lb.hosts: www.unitopia.de
        com.docker.lb.network: webnet
        com.docker.lb.port: 2018
      restart_policy:
        condition: on-failure
    ports:
      - "2018:5000"
    networks:
      webnet:
        ipv4_address: 172.16.238.10
  apache:
    image: 'bitnami/apache:2.4'
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
    ports:
      - '8443:8443'
    volumes:
      - 'apache_data:/bitnami'
    networks:
      webnet:
        ipv4_address: 172.16.238.11
volumes:
  apache_data:
networks:
  webnet:
    driver: overlay
    attachable: true
