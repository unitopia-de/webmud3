services:
  web:
    # replace username/repo:tag with your name and image details
    image: myonara/webmud3:develop
    environment: 
      NODE_ENV: 'production'
      HOST: '0.0.0.0'
      PORT: 5000
      TELNET_HOST: 'unitopia.de'
      TELNET_PORT: 9988
      TELNET_TLS: 'true'
      SOCKET_ROOT: '/socket.io'
      SOCKET_TIMEOUT: 900000
    # command: --tls-cert=/run/secrets/cert.pem --tls-key=/run/secrets/privkey.pem
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
      restart_policy:
        condition: on-failure
        delay: 20s
        max_attempts: 2 
        window: 3600s
    ports:
      - "5000:5000"
    networks:
      - webnet
networks:
  webnet:
    driver: bridge
